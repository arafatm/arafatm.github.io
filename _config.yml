title: arafatm
description: arafatm
baseurl: ""
url: "https://arafatm.github.io"
github_username: arafatm

remote_theme: pages-themes/hacker@v0.2.0

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  toc_levels: 1..5

plugins:
  - jekyll-remote-theme
  - jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      layout: default

collections:
  articles:
    output: true
    permalink: /:categories/:name

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
